name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_DEMO_PROXY_URL: ${{ vars.DEMO_PROXY_URL }}
      - name: Check the build carries the demo proxy URL
        env:
          DEMO_PROXY_URL: ${{ vars.DEMO_PROXY_URL }}
        run: test -n "$DEMO_PROXY_URL" && grep -rqF "$DEMO_PROXY_URL" dist
      - name: Zip the extension
        run: cd dist && zip -r ../sift-extension.zip .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" sift-extension.zip --title "$GITHUB_REF_NAME" --generate-notes
